<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#12151d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="src/ui/ui.css" />
  <title>Mazecore TD</title>
  <style>
    :root {
      --bg: #12151d;
      --panel: #1b1f2a;
      --panel2: #232836;
      --line: #2c3240;
      --text: #e8ecf3;
      --dim: #9aa3b2;
      --gold: #f2c14b;
      --danger: #e24b4a;
      --accent: #00d4ff;
      --ok: #5fce7a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', Tahoma, sans-serif;
      overflow: hidden;
    }
    #app { height: 100vh; }
    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      background: #2a2014;   /* warm hearth-brown letterbox, not cold black */
      overflow: hidden;
    }
    #game {
      display: block;
      background: var(--bg);
      box-shadow: 0 0 0 1px var(--line);
      touch-action: none;            /* the canvas owns its gestures (no scroll/zoom) */
      -webkit-tap-highlight-color: transparent;
      /* size + position are owned by viewport.js (letterbox + DPR) */
    }
    /* DOM widgets anchored over the canvas; viewport.js keeps it on the same box */
    #ui {
      position: absolute;
      pointer-events: none;          /* children opt back in individually */
      z-index: 10;
      overflow: visible;
    }
    /* Overlay banners drawn over the canvas (HTML, not canvas) */
    #overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 12px;
      gap: 8px;
    }
    .banner {
      background: rgba(253,246,230,0.95);
      border: 1.5px solid #c9a86b;
      border-radius: 10px;
      padding: 6px 16px;
      font-size: 15px;
      font-weight: 700;
      color: #4a3826;
      opacity: 0;
      transition: opacity .25s;
    }
    .banner.show { opacity: 1; }
    .banner.danger { color: #c4453e; border-color: #c4453e; }
    .banner.warn { color: #b07708; border-color: #e09b1a; }

    /* (the 320px HUD side panel is gone — all chrome lives over the canvas) */
    button {
      font-family: inherit; cursor: pointer;
      background: var(--panel2); color: var(--text);
      border: 1px solid var(--line); border-radius: 6px;
      padding: 6px 8px; font-size: 13px;
      transition: background .12s, border-color .12s;
    }
    button:hover:not(:disabled) { background: #2c3344; border-color: #3a4256; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    button.active { border-color: var(--accent); background: #1d2b35; }
    button.primary { background: #234d2c; border-color: #2f6b3a; }
    button.primary:hover:not(:disabled) { background: #2c6238; }
    button.danger { background: #4d2323; border-color: #6b2f2f; }

    .muted { color: var(--dim); font-size: 12px; }
    .hidden { display: none !important; }

    /* Start / game-over modal */
    #modal {
      position: absolute; inset: 0; background: rgba(8,10,14,0.86);
      display: flex; align-items: center; justify-content: center;
      z-index: 20;
    }
    .card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
      padding: 28px 32px; max-width: 520px; text-align: center;
    }
    .card h1 { margin: 0 0 8px 0; }
    .card p { color: var(--dim); line-height: 1.5; }
    .hero-pick { display: flex; gap: 12px; margin: 18px 0; }
    .hero-pick button { flex: 1; display: flex; flex-direction: column; gap: 6px; padding: 14px; }
    .hero-pick .h-glyph { font-size: 30px; }
    .hero-pick .h-name { font-weight: 700; font-size: 16px; }
    .hero-pick .h-role { font-size: 11px; color: var(--dim); line-height: 1.3; }

    /* ---- mobile / touch ---- */
    @media (pointer: coarse) {
      button { min-height: 40px; font-size: 14px; }       /* finger-sized targets */
    }
    @media (max-width: 900px), (orientation: portrait) {
      .card { max-width: 92vw; padding: 18px; }
      .hero-pick { flex-direction: row; flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="game" width="896" height="576"></canvas>
      <div id="ui"><!-- world-anchored DOM widgets (viewport.js positions this) --></div>
      <div id="overlay"></div>
      <div id="modal" class="hidden"><!-- start screen / game over injected here --></div>
    </div>
  </div>
  <div id="rotate" class="hidden"><span class="phone">📱</span><span>Rotate your device<br><span class="muted">Mazecore TD plays upright (portrait)</span></span></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
