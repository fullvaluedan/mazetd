<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#12151d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="src/ui/ui.css" />
  <title>Mazecore TD</title>
  <style>
    :root {
      --bg: #0f1320;
      --panel: #263252;
      --panel2: #313f63;
      --line: #51678f;
      --text: #f7f8fb;
      --dim: #a6b0c5;
      --gold: #f2c14b;
      --danger: #e24b4a;
      --accent: #6fd7ff;
      --ok: #5fce7a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background:
        radial-gradient(120% 100% at 50% 10%, rgba(92, 122, 191, 0.22) 0%, rgba(27, 33, 52, 0.85) 38%, rgba(10, 12, 18, 0.98) 100%),
        var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, sans-serif;
      overflow: hidden;
    }
    #app { height: 100vh; }
    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(120% 95% at 50% 20%, rgba(255, 211, 118, 0.10) 0%, rgba(255, 211, 118, 0.02) 28%, rgba(10, 12, 18, 0) 62%),
        linear-gradient(180deg, #182136 0%, #101521 55%, #090b10 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.04),
        inset 0 0 110px rgba(0, 0, 0, 0.34);
      overflow: hidden;
    }
    #battle-shell {
      position: absolute;
      inset: 0;
    }
    #board-slot, #board-surface {
      position: relative;
      min-width: 0;
      min-height: 0;
    }
    #board-surface {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #game {
      display: block;
      background: var(--bg);
      box-shadow:
        0 26px 72px rgba(0, 0, 0, 0.34),
        0 0 0 1px rgba(255, 255, 255, 0.08);
      touch-action: none;            /* the canvas owns its gestures (no scroll/zoom) */
      -webkit-tap-highlight-color: transparent;
      /* size + position are owned by viewport.js (letterbox + DPR) */
    }
    /* World widgets share the board surface; shell controls use dedicated decks. */
    #ui {
      position: absolute;
      pointer-events: none;          /* children opt back in individually */
      z-index: 10;
      overflow: visible;
    }
    /* Overlay banners drawn over the canvas (HTML, not canvas) */
    #overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 12px;
      gap: 8px;
    }
    .banner {
      background: linear-gradient(180deg, rgba(255, 249, 236, 0.98), rgba(239, 224, 190, 0.96));
      border: 1.5px solid #d0ac6a;
      border-radius: 12px;
      padding: 6px 16px;
      font-size: 15px;
      font-weight: 700;
      color: #4a3826;
      opacity: 0;
      box-shadow: 0 10px 24px rgba(10, 12, 18, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.7);
      transition: opacity .25s, transform .25s;
    }
    .banner.show { opacity: 1; transform: translateY(0); }
    .banner.danger { color: #c4453e; border-color: #c4453e; }
    .banner.warn { color: #b07708; border-color: #e09b1a; }

    .muted { color: var(--dim); font-size: 12px; }
    .hidden { display: none !important; }

    /* Start / game-over modal */
    #modal {
      position: absolute; inset: 0;
      background: radial-gradient(circle at center, rgba(25, 31, 48, 0.72), rgba(6, 8, 12, 0.92));
      backdrop-filter: blur(4px) saturate(1.08);
      display: flex; align-items: center; justify-content: center;
      z-index: 20;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage" data-ui-space="screen">
      <div id="battle-shell">
        <header id="status-deck" data-ui-space="shell-status">
          <div id="notifications" aria-live="polite"></div>
        </header>
        <main id="board-slot" data-ui-space="board-slot">
          <div id="board-surface">
            <canvas id="game" data-ui-space="world" width="896" height="576"></canvas>
            <div id="ui" data-ui-space="world-overlay"><!-- world-anchored DOM widgets --></div>
            <div id="overlay" data-ui-space="board-overlay"></div>
          </div>
        </main>
        <aside id="command-deck" data-ui-space="shell-command">
          <div id="context-panel"></div>
          <div id="command-actions"></div>
        </aside>
      </div>
      <div id="modal" data-ui-space="modal" class="hidden"><!-- start screen / game over injected here --></div>
    </div>
  </div>
  <div id="rotate" class="hidden"><span class="phone" aria-hidden="true"></span><span>Rotate your device<br><span class="muted">Mazecore TD adapts to either orientation.</span></span></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
