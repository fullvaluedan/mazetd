<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mazecore TD</title>
  <style>
    :root {
      --bg: #12151d;
      --panel: #1b1f2a;
      --panel2: #232836;
      --line: #2c3240;
      --text: #e8ecf3;
      --dim: #9aa3b2;
      --gold: #f2c14b;
      --danger: #e24b4a;
      --accent: #00d4ff;
      --ok: #5fce7a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', Tahoma, sans-serif;
      overflow: hidden;
    }
    #app {
      display: flex;
      flex-direction: row;
      height: 100vh;
      align-items: stretch;
    }
    #stage {
      position: relative;
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0c0e14;
      min-width: 0;
    }
    #game {
      display: block;
      background: var(--bg);
      image-rendering: pixelated;
      box-shadow: 0 0 0 1px var(--line);
      max-width: 100%;
      max-height: 100%;
    }
    /* Overlay banners drawn over the canvas (HTML, not canvas) */
    #overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 12px;
      gap: 8px;
    }
    .banner {
      background: rgba(20,24,33,0.9);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 16px;
      font-size: 15px;
      font-weight: 600;
      opacity: 0;
      transition: opacity .25s;
    }
    .banner.show { opacity: 1; }
    .banner.danger { color: var(--danger); border-color: var(--danger); }
    .banner.warn { color: var(--gold); border-color: var(--gold); }

    /* ---- HUD side panel ---- */
    #hud {
      flex: 0 0 320px;
      width: 320px;
      background: var(--panel);
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 10px;
      gap: 10px;
    }
    .hud-row { display: flex; gap: 8px; }
    .stat {
      flex: 1; background: var(--panel2); border: 1px solid var(--line);
      border-radius: 6px; padding: 8px; text-align: center;
    }
    .stat .label { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .5px; }
    .stat .value { font-size: 20px; font-weight: 700; }
    .stat .value.gold { color: var(--gold); }
    .stat .value.lives { color: var(--ok); }

    .section {
      background: var(--panel2); border: 1px solid var(--line);
      border-radius: 6px; padding: 8px;
    }
    .section h3 {
      margin: 0 0 6px 0; font-size: 12px; color: var(--dim);
      text-transform: uppercase; letter-spacing: .5px; font-weight: 600;
    }
    button {
      font-family: inherit; cursor: pointer;
      background: var(--panel2); color: var(--text);
      border: 1px solid var(--line); border-radius: 6px;
      padding: 6px 8px; font-size: 13px;
      transition: background .12s, border-color .12s;
    }
    button:hover:not(:disabled) { background: #2c3344; border-color: #3a4256; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    button.active { border-color: var(--accent); background: #1d2b35; }
    button.primary { background: #234d2c; border-color: #2f6b3a; }
    button.primary:hover:not(:disabled) { background: #2c6238; }
    button.danger { background: #4d2323; border-color: #6b2f2f; }

    .speed-row { display: flex; gap: 6px; }
    .speed-row button { flex: 1; }

    .tower-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .tower-btn { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; }
    .tower-btn .t-name { font-weight: 700; }
    .tower-btn .t-cost { color: var(--gold); font-size: 12px; }
    .tower-btn .t-blurb { color: var(--dim); font-size: 10px; line-height: 1.2; }

    .bar { height: 8px; background: #2a2f3c; border-radius: 4px; overflow: hidden; }
    .bar > div { height: 100%; background: var(--ok); transition: width .15s; }
    .bar.xp > div { background: var(--accent); }
    .bar.hp > div { background: var(--danger); }

    .muted { color: var(--dim); font-size: 12px; }
    .kbd { background:#11141c; border:1px solid var(--line); border-radius:4px; padding:1px 5px; font-size:11px; }
    .hidden { display: none !important; }
    .ability-row { display: flex; gap: 6px; }
    .ability-btn { flex: 1; position: relative; overflow: hidden; }
    .ability-btn .cd { position: absolute; left:0; bottom:0; width:100%; background: rgba(0,0,0,.55); }

    /* Start / game-over modal */
    #modal {
      position: absolute; inset: 0; background: rgba(8,10,14,0.86);
      display: flex; align-items: center; justify-content: center;
      z-index: 20;
    }
    .card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
      padding: 28px 32px; max-width: 520px; text-align: center;
    }
    .card h1 { margin: 0 0 8px 0; }
    .card p { color: var(--dim); line-height: 1.5; }
    .hero-pick { display: flex; gap: 12px; margin: 18px 0; }
    .hero-pick button { flex: 1; display: flex; flex-direction: column; gap: 6px; padding: 14px; }
    .hero-pick .h-glyph { font-size: 30px; }
    .hero-pick .h-name { font-weight: 700; font-size: 16px; }
    .hero-pick .h-role { font-size: 11px; color: var(--dim); line-height: 1.3; }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="game" width="896" height="576"></canvas>
      <div id="overlay"></div>
      <div id="modal" class="hidden"><!-- start screen / game over injected here --></div>
    </div>
    <div id="hud"><!-- HUD built by hud.js --></div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
